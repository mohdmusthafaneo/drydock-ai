services:
  postgres:
    # TimescaleDB HA (Postgres 16) includes Timescale + pgvector — Phase 4/5
    # Fresh volume required when switching from pgvector/pgvector:pg16.
    image: timescale/timescaledb-ha:pg16
    container_name: aidos-postgres
    environment:
      POSTGRES_USER: aidos
      POSTGRES_PASSWORD: aidos_dev_password
      POSTGRES_DB: aidos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidos -d aidos"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aidos-web
    ports:
      - "3000:3000"
    environment:
      AIDOS_PROCESS_ROLE: web
      DATABASE_URL: "postgresql://aidos:aidos_dev_password@postgres:5432/aidos?schema=public"
      AUTH_SECRET: "aidos-dev-secret-32chars-min"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      PLATFORM_WORKER_SECRET: "dev-worker-secret"
      AGENT_WORKER_ENABLED: "true"
      AGENT_INSTRUCTIONS_ROOT: "/data/agent-instructions"
      VALKEY_URL: "redis://valkey:6379"
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - agent_instructions:/data/agent-instructions
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aidos-worker
    environment:
      AIDOS_PROCESS_ROLE: worker
      DATABASE_URL: "postgresql://aidos:aidos_dev_password@postgres:5432/aidos?schema=public"
      AIDOS_API_URL: "http://web:3000"
      PLATFORM_WORKER_SECRET: "dev-worker-secret"
      AGENT_WORKER_ENABLED: "true"
      AGENT_WORKER_INTERVAL_SEC: "30"
      AGENT_INSTRUCTIONS_ROOT: "/data/agent-instructions"
      ML_INFERENCE_URL: "http://ml-inference:8080"
      WORKER_QUEUES: "all"
      VALKEY_URL: "redis://valkey:6379"
      NODE_ENV: "production"
    volumes:
      - agent_instructions:/data/agent-instructions
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
      ml-inference:
        condition: service_started
      valkey:
        condition: service_started
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: aidos-valkey
    ports:
      - "6379:6379"
    restart: unless-stopped

  ml-inference:
    build:
      context: ./services/ml-inference
      dockerfile: Dockerfile
    container_name: aidos-ml-inference
    ports:
      - "8080:8080"
    environment:
      AIDOS_EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
      AIDOS_EMBEDDING_DIM: "384"
    volumes:
      - ml_model_cache:/models/hf
    restart: unless-stopped

volumes:
  postgres_data:
  agent_instructions:
  ml_model_cache:
