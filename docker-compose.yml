services:
  postgres:
    image: postgres:16-alpine
    container_name: aidos-postgres
    environment:
      POSTGRES_USER: aidos
      POSTGRES_PASSWORD: aidos_dev_password
      POSTGRES_DB: aidos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidos -d aidos"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aidos-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://aidos:aidos_dev_password@postgres:5432/aidos?schema=public"
      AUTH_SECRET: "aidos-dev-secret-32chars-min"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: