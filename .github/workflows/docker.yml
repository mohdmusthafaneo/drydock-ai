name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip Coolify deployment'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  COOLIFY_DEPLOY_URL: http://15.207.73.151:8000/api/v1/deploy
  COOLIFY_WEB_UUID: udfrj0xlzaref1gdcwd5uk0e
  COOLIFY_WORKER_UUID: szep1ovhu4ph36a4s0h9yzhx

jobs:
  # ------------------------------------------------------------
  # Job 1: Build and push Docker image to ghcr.io
  # ------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Image digest
        run: "echo 'Digest: ${{ steps.build.outputs.digest }}'"
        if: github.event_name != 'pull_request'

  # ------------------------------------------------------------
  # Job 2a: Trigger Coolify web deployment
  # Job 2b: Trigger Coolify worker deployment (runs in parallel)
  # ------------------------------------------------------------
  deploy-web:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' &&
      github.event.inputs.skip_deploy != 'true'

    outputs:
      deployment_uuid: ${{ steps.deploy.outputs.deployment_uuid }}

    steps:
      - name: Trigger Coolify Web Deployment
        id: deploy
        run: |
          echo "Triggering Coolify web deployment..."
          echo "Image tags: ${{ needs.build-and-push.outputs.image-tags }}"
          echo "Force deploying: true"

          response=$(curl -s -X POST "${{ env.COOLIFY_DEPLOY_URL }}?uuid=${{ env.COOLIFY_WEB_UUID }}&force=true" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_API_KEY }}")

          echo "Response: $response"

          deployment_uuid=$(echo "$response" | grep -o '"deployment_uuid":"[^"]*"' | cut -d'"' -f4)
          echo "deployment_uuid=$deployment_uuid" >> $GITHUB_OUTPUT

          if echo "$response" | grep -q "deployment_uuid"; then
            echo "✅ Coolify web deployment triggered successfully"
            echo "Deployment UUID: $deployment_uuid"
          else
            echo "❌ Failed to trigger Coolify web deployment"
            exit 1
          fi

  deploy-worker:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' &&
      github.event.inputs.skip_deploy != 'true'

    outputs:
      deployment_uuid: ${{ steps.deploy.outputs.deployment_uuid }}

    steps:
      - name: Trigger Coolify Worker Deployment
        id: deploy
        run: |
          echo "Triggering Coolify worker deployment..."
          echo "Image tags: ${{ needs.build-and-push.outputs.image-tags }}"
          echo "Force deploying: false"

          response=$(curl -s -X POST "${{ env.COOLIFY_DEPLOY_URL }}?uuid=${{ env.COOLIFY_WORKER_UUID }}&force=false" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_API_KEY }}")

          echo "Response: $response"

          deployment_uuid=$(echo "$response" | grep -o '"deployment_uuid":"[^"]*"' | cut -d'"' -f4)
          echo "deployment_uuid=$deployment_uuid" >> $GITHUB_OUTPUT

          if echo "$response" | grep -q "deployment_uuid"; then
            echo "✅ Coolify worker deployment triggered successfully"
            echo "Deployment UUID: $deployment_uuid"
          else
            echo "❌ Failed to trigger Coolify worker deployment"
            exit 1
          fi
