name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  COOLIFY_DEPLOY_URL: http://15.207.73.151:8000/api/v1/deploy
  COOLIFY_APP_UUID: udfrj0xlzaref1gdcwd5uk0e

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Image digest
        run: "echo 'Digest: ${{ steps.build.outputs.digest }}'"
        if: github.event_name != 'pull_request'

      - name: Trigger Coolify Deployment
        if: github.event_name != 'pull_request'
        run: |
          echo "Triggering Coolify deployment..."
          response=$(curl -s -X POST "${{ env.COOLIFY_DEPLOY_URL }}?uuid=${{ env.COOLIFY_APP_UUID }}&force=true" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_API_KEY }}")
          echo "Response: $response"
          
          # Check if deployment was queued successfully
          if echo "$response" | grep -q "deployment_uuid"; then
            echo "✅ Coolify deployment triggered successfully"
          else
            echo "❌ Failed to trigger Coolify deployment"
            exit 1
          fi