# Optional split worker pools (Phase 5).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.workers.yml --profile split up -d
#
# Default `worker` (WORKER_QUEUES=all) is disabled under profile `split`.
# Start dedicated pools instead: worker-agents, worker-refresh, worker-enrich, worker-ml, worker-retention.

services:
  worker:
    profiles: ["monolith-worker"]

  worker-agents:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aidos-worker-agents
    environment:
      AIDOS_PROCESS_ROLE: worker
      DATABASE_URL: "postgresql://aidos:aidos_dev_password@postgres:5432/aidos?schema=public"
      AIDOS_API_URL: "http://web:3000"
      PLATFORM_WORKER_SECRET: "dev-worker-secret"
      AGENT_WORKER_ENABLED: "true"
      AGENT_INSTRUCTIONS_ROOT: "/data/agent-instructions"
      WORKER_QUEUES: "agents"
      VALKEY_URL: "redis://valkey:6379"
      NODE_ENV: "production"
    volumes:
      - agent_instructions:/data/agent-instructions
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
      valkey:
        condition: service_started
    restart: unless-stopped

  worker-refresh:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aidos-worker-refresh
    environment:
      AIDOS_PROCESS_ROLE: worker
      DATABASE_URL: "postgresql://aidos:aidos_dev_password@postgres:5432/aidos?schema=public"
      AIDOS_API_URL: "http://web:3000"
      PLATFORM_WORKER_SECRET: "dev-worker-secret"
      AGENT_INSTRUCTIONS_ROOT: "/data/agent-instructions"
      WORKER_QUEUES: "refresh"
      VALKEY_URL: "redis://valkey:6379"
      NODE_ENV: "production"
    volumes:
      - agent_instructions:/data/agent-instructions
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
      valkey:
        condition: service_started
    restart: unless-stopped

  worker-enrich:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aidos-worker-enrich
    environment:
      AIDOS_PROCESS_ROLE: worker
      DATABASE_URL: "postgresql://aidos:aidos_dev_password@postgres:5432/aidos?schema=public"
      AIDOS_API_URL: "http://web:3000"
      PLATFORM_WORKER_SECRET: "dev-worker-secret"
      AGENT_INSTRUCTIONS_ROOT: "/data/agent-instructions"
      WORKER_QUEUES: "enrich"
      VALKEY_URL: "redis://valkey:6379"
      NODE_ENV: "production"
    volumes:
      - agent_instructions:/data/agent-instructions
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
      valkey:
        condition: service_started
    restart: unless-stopped

  worker-ml:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aidos-worker-ml
    environment:
      AIDOS_PROCESS_ROLE: worker
      DATABASE_URL: "postgresql://aidos:aidos_dev_password@postgres:5432/aidos?schema=public"
      AIDOS_API_URL: "http://web:3000"
      PLATFORM_WORKER_SECRET: "dev-worker-secret"
      AGENT_INSTRUCTIONS_ROOT: "/data/agent-instructions"
      ML_INFERENCE_URL: "http://ml-inference:8080"
      WORKER_QUEUES: "ml"
      VALKEY_URL: "redis://valkey:6379"
      NODE_ENV: "production"
    volumes:
      - agent_instructions:/data/agent-instructions
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
      ml-inference:
        condition: service_started
      valkey:
        condition: service_started
    restart: unless-stopped

  worker-retention:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aidos-worker-retention
    environment:
      AIDOS_PROCESS_ROLE: worker
      DATABASE_URL: "postgresql://aidos:aidos_dev_password@postgres:5432/aidos?schema=public"
      AIDOS_API_URL: "http://web:3000"
      PLATFORM_WORKER_SECRET: "dev-worker-secret"
      AGENT_INSTRUCTIONS_ROOT: "/data/agent-instructions"
      WORKER_QUEUES: "retention"
      VALKEY_URL: "redis://valkey:6379"
      NODE_ENV: "production"
    volumes:
      - agent_instructions:/data/agent-instructions
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
      valkey:
        condition: service_started
    restart: unless-stopped
